<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>F1 Racing Stats</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0f;
            color: white;
        }

        header {
            background: #e10600;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
        }

        header p {
            margin: 8px 0 0;
            font-size: 16px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .top-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .top-section h2 {
            margin: 0;
        }

        button {
            background: #e10600;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background: #ff2b25;
        }

        .status {
            margin-bottom: 15px;
            color: #aaa;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #17171c;
            min-width: 650px;
        }

        th {
            background: #e10600;
            padding: 16px;
            text-align: center;
        }

        td {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        tr:hover {
            background: #24242b;
        }

        .position {
            font-weight: bold;
            font-size: 18px;
        }

        .driver {
            font-weight: bold;
        }

        .points {
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 30px;
            color: #aaa;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 26px;
            }

            .container {
                width: 95%;
                margin: 25px auto;
            }

            .top-section {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🏎️ F1 Racing Stats</h1>
    <p>Live Formula 1 Driver Championship Standings</p>
</header>

<div class="container">

    <div class="top-section">
        <h2>🏆 Driver Standings</h2>

        <button onclick="loadStandings()">
            🔄 Refresh
        </button>
    </div>

    <div class="status" id="status">
        Loading F1 standings...
    </div>

    <div class="table-container">

        <table>

            <thead>
                <tr>
                    <th>Position</th>
                    <th>Driver</th>
                    <th>Team</th>
                    <th>Points</th>
                    <th>Wins</th>
                </tr>
            </thead>

            <tbody id="standings">

                <tr>
                    <td colspan="5" class="loading">
                        Loading...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>

<footer>
    F1 Racing Stats © 2026
</footer>


<script>

    const API_URL =
        "https://api.jolpi.ca/ergast/f1/current/driverstandings.json";


    async function loadStandings() {

        const status =
            document.getElementById("status");

        const table =
            document.getElementById("standings");


        status.textContent =
            "Loading latest F1 standings...";


        table.innerHTML = `
            <tr>
                <td colspan="5" class="loading">
                    🏎️ Loading...
                </td>
            </tr>
        `;


        try {

            const response =
                await fetch(API_URL);


            if (!response.ok) {
                throw new Error(
                    "Unable to fetch F1 data"
                );
            }


            const data =
                await response.json();


            const standings =
                data.MRData
                    .StandingsTable
                    .StandingsLists[0]
                    .DriverStandings;


            table.innerHTML = "";


            standings.forEach(driverData => {

                const position =
                    driverData.position;

                const driver =
                    driverData.Driver;

                const driverName =
                    `${driver.givenName} ${driver.familyName}`;

                const team =
                    driverData.Constructors[0].name;

                const points =
                    driverData.points;

                const wins =
                    driverData.wins;


                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td class="position">
                        ${position}
                    </td>

                    <td class="driver">
                        ${driverName}
                    </td>

                    <td>
                        ${team}
                    </td>

                    <td class="points">
                        ${points}
                    </td>

                    <td>
                        ${wins}
                    </td>

                `;


                table.appendChild(row);

            });


            status.textContent =
                "✅ Latest F1 driver standings loaded successfully.";


        } catch (error) {

            console.error(error);


            table.innerHTML = `
                <tr>
                    <td colspan="5" class="loading">
                        ❌ Unable to load F1 standings.
                        <br><br>
                        Please try again.
                    </td>
                </tr>
            `;


            status.textContent =
                "❌ Error loading F1 data.";

        }

    }


    // Load standings automatically
    loadStandings();

</script>

</body>
</html>==
